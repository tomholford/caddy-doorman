name: Build & Publish

on:
  workflow_dispatch:
  schedule:
    # 00:00 on the 1st of every month — rebuild to pick up newer plugin commits
    # (plugins are unpinned; the CACHEBUST arg forces a fresh fetch on schedule).
    - cron: "0 0 1 * *"
  push:
    branches: [master]
    # Dockerfile only. Editing this workflow does not publish; run it by
    # hand after changing tags, platforms, or build-args.
    paths:
      - Dockerfile

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tomholford/caddy-doorman

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse Caddy version from Dockerfile
        id: version
        run: |
          version=$(grep -Eo 'caddy:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      - name: Compute cache-bust (monthly schedule fetches fresh plugins)
        id: cb
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=$(date +%Y-%m)" | tee -a "$GITHUB_OUTPUT"
          else
            echo "value=static" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=caddy-doorman
            org.opencontainers.image.description=Caddy with defender, ratelimit, namecheap/cloudflare DNS, and a dynamic trusted-proxy IP source

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CACHEBUST=${{ steps.cb.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "## caddy-doorman built"
            echo ""
            echo "**Caddy:** v${{ steps.version.outputs.version }}"
            echo "**Platforms:** linux/amd64, linux/arm64"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
